name: CI

# Pull requests only. Pushes to main are already covered by the `test` job in
# release-please.yml, which gates the release via `needs: test` — running both here
# meant every main push executed typecheck/test/build twice and produced two separate
# checks both named "test".
#
# Deliberately NOT gated behind CLODEX_PUBLISH_ENABLED: that variable keeps the
# *release* machinery dormant outside the dedicated repo, but typecheck/test/build
# publish nothing, and repository variables do not resolve for pull_request runs from a
# fork — gating here would silently skip CI for external contributors, the exact failure
# this workflow exists to prevent.
on:
  pull_request:

permissions:
  contents: read

# A new push to a PR branch cancels the in-flight run for the previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Corepack reads the pinned pnpm version from package.json's packageManager field.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The Windows VS Code launcher is native code compiled on the user's machine; nothing on the
  # Linux job can compile or run it. This job builds it with the runner's own .NET Framework
  # csc.exe and drives the resulting clodex-claude.exe the way the extension does (see
  # tests/vscode-launcher.windows.test.ts), then proves the patched-install substitution through
  # it on NTFS (tests/wrapper-substitution.windows.test.ts). Only those files run here — the full
  # suite is the Linux job's business.
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run tests/vscode-launcher.windows.test.ts tests/wrapper-substitution.windows.test.ts
